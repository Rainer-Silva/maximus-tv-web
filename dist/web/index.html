<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maximus TV">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Maximus TV</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="view">
  <form class="box" id="login-form" autocomplete="off">
    <div class="logo">MAXIMUS <b>TV</b></div>
    <p class="sub">Xtream Codes login (from your provider's email)</p>
    <label>Server<input class="f" id="l-server" value="http://88.135.69.66:2095" spellcheck="false"></label>
    <label>Backup server (optional)<input class="f" id="l-backup" value="http://172.110.210.78:2095" spellcheck="false"></label>
    <label>Username<input class="f" id="l-user" spellcheck="false" autocapitalize="off"></label>
    <label>Password<input class="f" id="l-pass" type="password"></label>
    <button class="f btn" type="submit">Connect</button>
    <div class="err" id="l-err"></div>
  </form>
</div>

<div id="main" class="view hidden">
  <header>
    <div class="logo">MAXIMUS <b>TV</b></div>
    <nav id="tabs">
      <button class="f tab" data-tab="live">Live TV</button>
      <button class="f tab" data-tab="vod">Movies</button>
      <button class="f tab" data-tab="series">Series</button>
      <button class="f tab" data-tab="search">Search</button>
      <button class="f tab" data-tab="settings">Settings</button>
    </nav>
  </header>
  <section id="browse" class="pane">
    <aside id="cats"></aside>
    <div id="grid-wrap"><div id="status" class="status"></div><div id="grid" class="grid"></div></div>
  </section>
  <section id="search" class="pane hidden">
    <div class="searchbar">
      <input class="f" id="q" type="search" placeholder="Search channels, movies, series…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <div id="sfilter">
        <button class="f chip on" data-f="all">All</button>
        <button class="f chip" data-f="live">Live</button>
        <button class="f chip" data-f="vod">Movies</button>
        <button class="f chip" data-f="series">Series</button>
      </div>
    </div>
    <div id="sres" class="sres"><div class="status">Type at least 2 letters.</div></div>
  </section>
  <section id="settings" class="pane hidden">
    <div class="box wide">
      <h3>Account</h3>
      <div id="acct" class="status"></div>
      <label class="row"><input type="checkbox" class="f" id="s-adult"> Show adult categories</label>
      <button class="f btn" id="s-refresh">Reload lists from server</button>
      <button class="f btn ghost" id="s-logout">Log out (forget login on this device)</button>
      <p class="note">Your plan allows 1 connection: stop playback on one device before watching on another.</p>
    </div>
  </section>
</div>

<div id="detail" class="overlay hidden">
  <div class="dbox">
    <button class="f btn ghost close" id="d-close">✕ Back</button>
    <div class="dhead"><img id="d-img" alt=""><div><h2 id="d-title"></h2><p id="d-plot" class="note"></p></div></div>
    <div id="d-seasons" class="chips"></div>
    <div id="d-eps" class="eps"></div>
  </div>
</div>

<div id="player" class="overlay hidden">
  <video id="video" controls playsinline autoplay></video>
  <div class="pbar"><button class="f btn ghost" id="p-close">✕ Close</button><span id="p-title"></span><span id="p-msg" class="err"></span></div>
</div>

<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
